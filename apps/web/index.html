<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parkwright</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <!-- Google Analytics 4. Only on the live site, so local runs are not counted. -->
    <script>
      if (location.hostname.endsWith('lopeselio.online')) {
        const s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-QWMVG3SMBC';
        document.head.append(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'G-QWMVG3SMBC');
      }
    </script>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <header id="top"></header>
    <nav id="tools"></nav>
    <aside id="drawer"></aside>
    <aside id="side"></aside>
    <section id="terminal"><div class="term-head"><span>park terminal</span><kbd>`</kbd></div><div id="term-body"></div></section>
    <div id="toast" class="toast"></div>
    <div id="cam" aria-label="Camera">
      <button type="button" data-cam="left" aria-label="Turn the view left" title="Turn view (Q)">⟲</button>
      <button type="button" data-cam="rot" aria-label="Rotate the piece you're placing" title="Rotate piece (R)">R</button>
      <button type="button" data-cam="right" aria-label="Turn the view right" title="Turn view (E)">⟳</button>
    </div>
    <footer id="keys">drag paths · R rotate · Q/E turn · WASD or right-drag pan · wheel zoom · space pause · M sound · ` terminal</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
