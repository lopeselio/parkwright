<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parkwright</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <!-- Google Analytics 4: only on the live site, and only after the visitor allows it. The answer is kept
         for six months in a cookie shared by every *.lopeselio.online site, so each visitor is asked once. -->
    <script>
      (function () {
        if (!location.hostname.endsWith('lopeselio.online')) return;
        var id = 'G-QWMVG3SMBC';
        var load = function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
          document.head.append(s);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { dataLayer.push(arguments); };
          gtag('js', new Date());
          gtag('config', id);
        };
        var answer = (document.cookie.match(/(?:^|; )analytics_consent=(yes|no)/) || [])[1];
        if (answer === 'yes') return load();
        if (answer === 'no') return;
        var ask = function () {
          var bar = document.createElement('div');
          bar.setAttribute('role', 'region');
          bar.setAttribute('aria-label', 'Analytics cookies');
          bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;max-width:520px;margin:0 auto;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#15131c;color:#f2f0f7;border:1px solid #3a3550;border-radius:10px;font:14px/1.4 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.45)';
          var text = document.createElement('span');
          text.textContent = 'Allow Google Analytics cookies, so we can count visits?';
          text.style.cssText = 'flex:1 1 220px';
          bar.append(text);
          [['Allow', 'yes'], ['No thanks', 'no']].forEach(function (b) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = b[0];
            btn.style.cssText = 'padding:6px 14px;border-radius:7px;border:1px solid #6b6490;background:#2a2540;color:inherit;font:inherit;cursor:pointer';
            btn.onclick = function () {
              document.cookie = 'analytics_consent=' + b[1] + '; domain=.lopeselio.online; path=/; max-age=15552000; SameSite=Lax; Secure';
              bar.remove();
              if (b[1] === 'yes') load();
            };
            bar.append(btn);
          });
          document.body.append(bar);
        };
        if (document.body) ask(); else addEventListener('DOMContentLoaded', ask);
      })();
    </script>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <header id="top"></header>
    <nav id="tools"></nav>
    <aside id="drawer"></aside>
    <aside id="side"></aside>
    <section id="terminal"><div class="term-head"><span>park terminal</span><kbd>`</kbd></div><div id="term-body"></div></section>
    <div id="toast" class="toast"></div>
    <div id="cam" aria-label="Camera">
      <button type="button" data-cam="left" aria-label="Turn the view left" title="Turn view (Q)">⟲</button>
      <button type="button" data-cam="rot" aria-label="Rotate the piece you're placing" title="Rotate piece (R)">R</button>
      <button type="button" data-cam="right" aria-label="Turn the view right" title="Turn view (E)">⟳</button>
    </div>
    <footer id="keys">drag paths · R rotate · Q/E turn · WASD or right-drag pan · wheel zoom · space pause · M sound · ` terminal</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
